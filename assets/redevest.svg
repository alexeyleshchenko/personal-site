<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-hidden="true">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#1a181c"/>
  <rect width="640" height="360" filter="url(#grain)" opacity="0.55"/>
  <g filter="url(#shadow)">
    <rect x="188" y="278" width="264" height="6" rx="3" fill="#c9a24a"/>
    <rect x="214" y="168" width="56" height="110" rx="4" fill="#e8c56a"/>
    <rect x="266" y="168" width="10" height="110" fill="#c9a24a"/>
    <rect x="292" y="92" width="56" height="186" rx="4" fill="#e8c56a"/>
    <rect x="344" y="92" width="10" height="186" fill="#c9a24a"/>
    <rect x="370" y="198" width="56" height="80" rx="4" fill="#e8c56a"/>
    <rect x="422" y="198" width="10" height="80" fill="#c9a24a"/>
    <rect x="324" y="108" width="42" height="16" rx="2" fill="#d45a8c"/>
    <polygon points="366,124 366,108 348,124" fill="#8a3a5c" opacity="0.55"/>
  </g>
</svg>
